{% extends "base.html" %}

{% block title %}Reset Password | Bookmarks{% endblock %}

{% block content %}
<div class="card card-auth">
  <h1>Forgotten your password?</h1>
  <p>Enter your registered e-mail address below to receive password reset instructions.</p>

  <form method="post">
    {{ form.as_p }}
    {% csrf_token %}
    <p style="margin-top: 1.25rem;">
      <input type="submit" value="Send Reset Instructions">
    </p>
  </form>

  <div class="auth-footer-links">
    <p><a href="{% url 'login' %}">&larr; Back to Log-in</a></p>
  </div>
</div>
{% endblock %}
