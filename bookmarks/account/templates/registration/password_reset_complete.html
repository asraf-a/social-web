{% extends "base.html" %}

{% block title %}Password Reset Complete | Bookmarks{% endblock %}

{% block content %}
<div class="card card-auth" style="text-align: center;">
  <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">✅</div>
  <h1>Password Reset!</h1>
  <p>Your password has been successfully reset. You can now log in using your new credentials.</p>
  <p style="margin-top: 1.5rem;">
    <a href="{% url 'login' %}" class="btn-primary" style="display: inline-flex; width: auto;">Log-in Now</a>
  </p>
</div>
{% endblock %}
