{% extends "base.html" %}

{% block title %}Log-in{% endblock %}

{% block content %}
<div class="card card-auth">
  <h1>Log-in (Manual View)</h1>
  <p>Please use the following form to log in:</p>
  <form method="post">
    {{ form.as_p }}
    {% csrf_token %}
    <p><input type="submit" value="Log in"></p>
  </form>
  <div class="auth-footer-links">
    <p>Using built-in auth? <a href="{% url 'login' %}">Go to Standard Login</a></p>
  </div>
</div>
{% endblock %}
